name: tests

# Runs the PHPUnit suite (PaperlessClient logic) across the supported PHP range,
# plus cheap syntax guards on PHP and JS. composer.json pins the dependency
# resolution platform to PHP 7.4, so every matrix entry installs the same
# 7.4-compatible deps (PHPUnit 9.x) and just exercises the code on its own runtime.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP
        run: |
          php -l paperless_attach.php
          php -l lib/PaperlessClient.php

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  js-lint:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: node --check
        run: node --check js/paperless.js
